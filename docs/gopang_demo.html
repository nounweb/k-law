<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고팡(Gopang) 데모</title>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161920;
    --surface2: #1e2230;
    --border: #2a2f3d;
    --text: #e8eaf0;
    --muted: #6b7280;
    --accent: #3b7ddd;
    --accent2: #5b9cf6;
    --s0: #22c55e;
    --s1: #facc15;
    --s2: #f97316;
    --s3: #ef4444;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    --font-ui: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 헤더 ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: var(--accent2); }
  .badge {
    font-size: 10px; font-weight: 600; letter-spacing: 1px;
    background: var(--accent); color: #fff;
    padding: 2px 8px; border-radius: 20px;
  }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .user-pill {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 12px;
    font-size: 13px; color: var(--accent2);
  }
  .server-status {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--s3); transition: background .3s;
  }
  .server-status.ok { background: var(--s0); }

  /* ── 레이아웃 ── */
  .layout {
    display: grid;
    grid-template-columns: 220px 1fr 340px;
    flex: 1;
    overflow: hidden;
  }

  /* ── 사이드바 ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-section {
    padding: 12px 14px 6px;
    font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
    color: var(--muted); text-transform: uppercase;
  }
  .conv-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .conv-item {
    padding: 9px 10px; border-radius: 6px; cursor: pointer;
    font-size: 13px; color: var(--muted);
    transition: all .15s;
  }
  .conv-item:hover { background: var(--surface2); color: var(--text); }
  .conv-item.active { background: var(--accent); color: #fff; }
  .sidebar-actions { padding: 12px; border-top: 1px solid var(--border); }
  .btn {
    display: block; width: 100%;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 8px 12px; border-radius: 6px;
    font-size: 12px; cursor: pointer; text-align: center;
    transition: all .15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent2); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn-primary:hover { background: var(--accent2); border-color: var(--accent2); color: #fff; }

  /* ── 채팅 영역 ── */
  .chat-area {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-header {
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
  }
  .chat-header .ws-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--s3); flex-shrink: 0;
  }
  .chat-header .ws-dot.connected { background: var(--s0); }
  .messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg-row { display: flex; gap: 8px; align-items: flex-start; }
  .msg-row.mine { flex-direction: row-reverse; }
  .msg-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--surface2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--accent2);
    flex-shrink: 0;
  }
  .msg-body { max-width: 70%; }
  .msg-name { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .msg-row.mine .msg-name { text-align: right; }
  .msg-bubble {
    padding: 8px 12px; border-radius: 12px;
    font-size: 14px; line-height: 1.5;
    background: var(--surface2); border: 1px solid var(--border);
    word-break: break-word;
  }
  .msg-row.mine .msg-bubble { background: var(--accent); border-color: var(--accent); }
  .msg-grade {
    margin-top: 4px;
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; color: var(--muted);
  }
  .msg-row.mine .msg-grade { justify-content: flex-end; }
  .grade-badge {
    font-size: 10px; font-weight: 700; font-family: var(--font-mono);
    padding: 1px 6px; border-radius: 4px;
    cursor: pointer;
  }
  .grade-s0 { background: rgba(34,197,94,.15); color: var(--s0); }
  .grade-s1 { background: rgba(250,204,21,.15); color: var(--s1); }
  .grade-s2 { background: rgba(249,115,22,.15); color: var(--s2); }
  .grade-s3 { background: rgba(239,68,68,.15); color: var(--s3); }

  /* 시스템 메시지 */
  .sys-msg {
    text-align: center; font-size: 11px; color: var(--muted);
    padding: 4px 0;
  }
  .alert-msg {
    background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.25);
    border-radius: 8px; padding: 10px 14px; font-size: 12px;
  }
  .alert-msg.s2 { background: rgba(249,115,22,.08); border-color: rgba(249,115,22,.25); }

  /* 입력 영역 */
  .input-area {
    padding: 12px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; gap: 8px; align-items: flex-end;
    flex-shrink: 0;
  }
  .input-area textarea {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; color: var(--text);
    font-family: var(--font-ui); font-size: 14px; resize: none;
    max-height: 120px; min-height: 42px; line-height: 1.4;
    transition: border-color .15s;
  }
  .input-area textarea:focus { outline: none; border-color: var(--accent); }
  .input-area textarea::placeholder { color: var(--muted); }
  .send-btn {
    background: var(--accent); border: none; border-radius: 8px;
    color: #fff; padding: 10px 16px; cursor: pointer;
    font-size: 13px; font-weight: 600; transition: background .15s;
    white-space: nowrap;
  }
  .send-btn:hover { background: var(--accent2); }
  .send-btn:disabled { background: var(--surface2); color: var(--muted); cursor: not-allowed; }

  /* ── 디버그 패널 ── */
  .debug-panel {
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .debug-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    color: var(--muted); text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  .debug-tabs {
    display: flex; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .debug-tab {
    flex: 1; padding: 8px; text-align: center;
    font-size: 11px; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; transition: all .15s;
  }
  .debug-tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }
  .debug-content {
    flex: 1; overflow-y: auto; padding: 12px;
    font-family: var(--font-mono); font-size: 11px; line-height: 1.6;
  }
  .debug-empty { color: var(--muted); font-style: italic; font-family: var(--font-ui); }
  .debug-json { color: #a8b4c8; white-space: pre-wrap; word-break: break-all; }
  .json-key { color: #7dd3fc; }
  .json-str { color: #86efac; }
  .json-num { color: #fbbf24; }
  .json-bool { color: #c084fc; }

  /* PDV 로그 */
  .pdv-item {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; margin-bottom: 8px;
    font-size: 11px;
  }
  .pdv-item .pdv-grade { font-weight: 700; }
  .pdv-item .pdv-hash { color: var(--muted); word-break: break-all; }
  .pdv-item .pdv-anchor { color: var(--accent2); }

  /* ── 인증 화면 ── */
  #auth-screen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .auth-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 32px; width: 340px;
  }
  .auth-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .auth-title span { color: var(--accent2); }
  .auth-sub { font-size: 12px; color: var(--muted); margin-bottom: 24px; }
  .auth-tabs { display: flex; gap: 4px; margin-bottom: 20px; }
  .auth-tab {
    flex: 1; padding: 8px; text-align: center;
    border-radius: 6px; cursor: pointer;
    font-size: 13px; font-weight: 600;
    background: var(--surface2); color: var(--muted);
    border: 1px solid var(--border); transition: all .15s;
  }
  .auth-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 5px; font-weight: 600; letter-spacing: .5px; }
  .field input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 9px 12px; color: var(--text);
    font-size: 14px; font-family: var(--font-ui);
    transition: border-color .15s;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .auth-btn {
    width: 100%; background: var(--accent); border: none;
    border-radius: 6px; color: #fff; padding: 11px;
    font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px;
    transition: background .15s;
  }
  .auth-btn:hover { background: var(--accent2); }
  .auth-error { color: var(--s3); font-size: 12px; margin-top: 10px; text-align: center; }

  /* ── 모달 ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center; z-index: 200;
  }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 24px; width: 320px;
  }
  .modal-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
  .modal-close { float: right; cursor: pointer; color: var(--muted); font-size: 18px; }

  /* 스크롤바 */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- ── 인증 화면 ── -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-title">고<span>팡</span></div>
    <div class="auth-sub">AI 법학 비서 채팅 플랫폼 — 데모</div>
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchAuth('login')">로그인</div>
      <div class="auth-tab" onclick="switchAuth('register')">회원가입</div>
    </div>
    <div class="field"><label>사용자명</label><input id="auth-username" placeholder="username" autocomplete="off"></div>
    <div class="field"><label>비밀번호</label><input id="auth-password" type="password" placeholder="password"></div>
    <button class="auth-btn" onclick="doAuth()">시작하기</button>
    <div id="auth-error" class="auth-error"></div>
  </div>
</div>

<!-- ── 메인 UI ── -->
<header>
  <div class="logo">고<span>팡</span></div>
  <div class="badge">DEMO</div>
  <div class="header-right">
    <div class="user-pill" id="header-username">—</div>
    <div class="server-status" id="server-dot" title="서버 상태"></div>
  </div>
</header>

<div class="layout">

  <!-- 사이드바 -->
  <div class="sidebar">
    <div class="sidebar-section">대화</div>
    <div class="conv-list" id="conv-list">
      <div class="sys-msg" style="padding:16px 0;font-size:12px;">대화방이 없습니다</div>
    </div>
    <div class="sidebar-actions">
      <button class="btn btn-primary" onclick="showNewConv()">+ 새 대화</button>
      <button class="btn" style="margin-top:6px" onclick="logout()">로그아웃</button>
    </div>
  </div>

  <!-- 채팅 -->
  <div class="chat-area">
    <div class="chat-header">
      <div class="ws-dot" id="ws-dot"></div>
      <span id="chat-title">대화방을 선택하세요</span>
    </div>
    <div class="messages" id="messages">
      <div class="sys-msg">고팡 데모에 오신 것을 환영합니다.<br>좌측에서 대화를 시작하세요.</div>
    </div>
    <div class="input-area">
      <textarea id="msg-input" placeholder="메시지 입력 (Shift+Enter: 줄바꿈, Enter: 전송)" rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>전송</button>
    </div>
  </div>

  <!-- 디버그 패널 -->
  <div class="debug-panel">
    <div class="debug-header">
      🔍 디버그
    </div>
    <div class="debug-tabs">
      <div class="debug-tab active" onclick="switchDebug('pipeline')">파이프라인</div>
      <div class="debug-tab" onclick="switchDebug('pdv')">PDV 로그</div>
      <div class="debug-tab" onclick="switchDebug('raw')">원시 JSON</div>
    </div>
    <div class="debug-content" id="debug-content">
      <div class="debug-empty">메시지를 전송하면 분석 결과가 여기 표시됩니다.</div>
    </div>
  </div>

</div>

<!-- 새 대화 모달 -->
<div class="modal-overlay" id="new-conv-modal" style="display:none">
  <div class="modal-box">
    <span class="modal-close" onclick="closeModal()">✕</span>
    <div class="modal-title">새 대화 시작</div>
    <div class="field"><label>상대방 사용자명</label><input id="new-conv-target" placeholder="username" autocomplete="off"></div>
    <button class="auth-btn" onclick="createConv()">대화 시작</button>
    <div id="conv-error" class="auth-error"></div>
  </div>
</div>

<script>
// ── 상태 ──
const API  = `http://144.24.90.233:8000`;
const WS   = `ws://144.24.90.233:8000`;

let token  = localStorage.getItem('gopang_token') || '';
let myUser = JSON.parse(localStorage.getItem('gopang_user') || 'null');
let ws     = null;
let currentConv = null;
let debugMode   = 'pipeline';
let lastPacket  = null;
let pdvLog      = [];
let authMode    = 'login';

// ── 유틸 ──
async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) }
  };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || JSON.stringify(data));
  return data;
}

function gradeClass(g) { return `grade-${g.toLowerCase()}`; }
function gradeColor(g) {
  return { S0: '#22c55e', S1: '#facc15', S2: '#f97316', S3: '#ef4444' }[g] || '#6b7280';
}

function syntaxHL(obj) {
  return JSON.stringify(obj, null, 2)
    .replace(/("[\w\u3131-\uD79D]+")\s*:/g, '<span class="json-key">$1</span>:')
    .replace(/:\s*(".*?")/g, ': <span class="json-str">$1</span>')
    .replace(/:\s*(\d+\.?\d*)/g, ': <span class="json-num">$1</span>')
    .replace(/:\s*(true|false|null)/g, ': <span class="json-bool">$1</span>');
}

function scrollBottom(el) { el.scrollTop = el.scrollHeight; }

// ── 인증 ──
function switchAuth(mode) {
  authMode = mode;
  document.querySelectorAll('.auth-tab').forEach((t, i) => {
    t.classList.toggle('active', (mode === 'login' ? 0 : 1) === i);
  });
}

async function doAuth() {
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value.trim();
  if (!username || !password) { showAuthErr('사용자명과 비밀번호를 입력하세요'); return; }
  try {
    const path = authMode === 'login' ? '/auth/login' : '/auth/register';
    const data = await api('POST', path, { username, password });
    token = data.token;
    myUser = { id: data.user_id, username: data.username };
    localStorage.setItem('gopang_token', token);
    localStorage.setItem('gopang_user', JSON.stringify(myUser));
    onLogin();
  } catch (e) { showAuthErr(e.message); }
}

function showAuthErr(msg) { document.getElementById('auth-error').textContent = msg; }

function onLogin() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('header-username').textContent = myUser.username;
  checkServer();
  loadConvs();
}

function logout() {
  token = ''; myUser = null; ws && ws.close();
  localStorage.removeItem('gopang_token');
  localStorage.removeItem('gopang_user');
  location.reload();
}

// ── 서버 상태 ──
async function checkServer() {
  try {
    await fetch(API + '/health');
    document.getElementById('server-dot').classList.add('ok');
  } catch { document.getElementById('server-dot').classList.remove('ok'); }
  setTimeout(checkServer, 10000);
}

// ── 대화 목록 ──
async function loadConvs() {
  try {
    const convs = await api('GET', '/conversations');
    const list = document.getElementById('conv-list');
    if (!convs.length) {
      list.innerHTML = '<div class="sys-msg" style="padding:16px 0;font-size:12px;">대화방이 없습니다</div>';
      return;
    }
    list.innerHTML = convs.map(c => `
      <div class="conv-item" id="conv-${c.conv_id}" onclick="openConv('${c.conv_id}','${c.with}')">
        💬 ${c.with}
      </div>`).join('');
  } catch (e) { console.error(e); }
}

async function openConv(convId, withUser) {
  currentConv = convId;
  document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById(`conv-${convId}`);
  if (el) el.classList.add('active');
  document.getElementById('chat-title').textContent = withUser;
  document.getElementById('send-btn').disabled = false;

  // 메시지 로드
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';
  try {
    const history = await api('GET', `/messages/${convId}`);
    history.forEach(m => appendMessage({
      sender: m.sender_name,
      content: m.content,
      grade: m.phase_grade || 'S0',
      timestamp: m.timestamp,
      pipeline: m.phase_json ? JSON.parse(m.phase_json) : {},
      pdv: { hash: m.hash_sha256, anchor_l0: m.anchor_l0 }
    }));
    scrollBottom(msgs);
  } catch (e) { console.error(e); }

  // WebSocket 연결
  if (ws) ws.close();
  ws = new WebSocket(`${WS}/ws/${convId}?token=${token}`);
  ws.onopen = () => document.getElementById('ws-dot').classList.add('connected');
  ws.onclose = () => document.getElementById('ws-dot').classList.remove('connected');
  ws.onmessage = e => {
    const pkt = JSON.parse(e.data);
    if (pkt.type === 'message') {
      appendMessage(pkt);
      updateDebug(pkt);
      scrollBottom(msgs);
    } else if (pkt.type === 'alert') {
      appendAlert(pkt);
      scrollBottom(msgs);
    }
  };
}

// ── 메시지 렌더 ──
function appendMessage(pkt) {
  const msgs = document.getElementById('messages');
  const isMine = pkt.sender === myUser.username;
  const avatar = pkt.sender.charAt(0).toUpperCase();
  const grade = pkt.grade || 'S0';
  const elapsed = pkt.elapsed_ms ? `${pkt.elapsed_ms}ms` : '';
  const div = document.createElement('div');
  div.className = `msg-row${isMine ? ' mine' : ''}`;
  div.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div class="msg-body">
      <div class="msg-name">${pkt.sender}</div>
      <div class="msg-bubble">${escHtml(pkt.content)}</div>
      <div class="msg-grade">
        <span class="grade-badge ${gradeClass(grade)}" title="클릭: 파이프라인 보기"
          onclick='showPipeline(${JSON.stringify(pkt.pipeline || {})})'>${grade}</span>
        ${elapsed ? `<span>${elapsed}</span>` : ''}
        ${pkt.pdv && pkt.pdv.hash ? `<span style="color:var(--accent2);cursor:pointer" title="${pkt.pdv.hash}">🔒</span>` : ''}
      </div>
    </div>`;
  msgs.appendChild(div);
}

function appendAlert(pkt) {
  const msgs = document.getElementById('messages');
  const cls = pkt.grade === 'S3' ? '' : ' s2';
  const div = document.createElement('div');
  div.className = `alert-msg${cls}`;
  div.innerHTML = `
    <strong>${pkt.grade === 'S3' ? '🚫 차단' : '⚠️ 경고'} [${pkt.grade}]</strong><br>
    ${escHtml(pkt.notice || '위법성이 감지되어 처리되었습니다.')}
    ${pkt.legal_basis ? `<br><small style="color:var(--muted)">${escHtml(pkt.legal_basis)}</small>` : ''}`;
  msgs.appendChild(div);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 메시지 전송 ──
function sendMessage() {
  if (!ws || ws.readyState !== 1) { alert('WebSocket 미연결'); return; }
  const inp = document.getElementById('msg-input');
  const content = inp.value.trim();
  if (!content) return;
  ws.send(JSON.stringify({ content }));
  inp.value = '';
  inp.style.height = '';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ── 새 대화 ──
function showNewConv() {
  document.getElementById('new-conv-modal').style.display = 'flex';
  document.getElementById('new-conv-target').focus();
}
function closeModal() {
  document.getElementById('new-conv-modal').style.display = 'none';
  document.getElementById('conv-error').textContent = '';
}
async function createConv() {
  const target = document.getElementById('new-conv-target').value.trim();
  if (!target) return;
  try {
    const data = await api('POST', '/conversations', { target_username: target });
    closeModal();
    await loadConvs();
    openConv(data.conv_id, target);
  } catch (e) {
    document.getElementById('conv-error').textContent = e.message;
  }
}

// ── 디버그 패널 ──
function switchDebug(mode) {
  debugMode = mode;
  document.querySelectorAll('.debug-tab').forEach((t, i) => {
    t.classList.toggle('active', ['pipeline','pdv','raw'][i] === mode);
  });
  renderDebug();
}

function updateDebug(pkt) {
  lastPacket = pkt;
  if (pkt.pdv && pkt.pdv.pdv_id) pdvLog.unshift(pkt.pdv);
  renderDebug();
}

function renderDebug() {
  const el = document.getElementById('debug-content');
  if (debugMode === 'raw') {
    el.innerHTML = lastPacket
      ? `<div class="debug-json">${syntaxHL(lastPacket)}</div>`
      : '<div class="debug-empty">메시지를 전송하면 표시됩니다.</div>';
    return;
  }
  if (debugMode === 'pdv') {
    el.innerHTML = pdvLog.length
      ? pdvLog.map(p => `
          <div class="pdv-item">
            <div class="pdv-grade" style="color:${gradeColor(p.grade)}">${p.grade} — PDV 기록</div>
            <div class="pdv-hash">SHA256: ${p.hash ? p.hash.slice(0,32) + '...' : '—'}</div>
            <div class="pdv-anchor">L0: ${p.anchor_l0 || '—'}</div>
          </div>`).join('')
      : '<div class="debug-empty">PDV 기록이 없습니다.</div>';
    return;
  }
  // pipeline
  if (!lastPacket || !lastPacket.pipeline) {
    el.innerHTML = '<div class="debug-empty">메시지를 전송하면 분석 결과가 표시됩니다.</div>';
    return;
  }
  const p = lastPacket.pipeline;
  const grade = lastPacket.grade || 'S0';
  const score = p.phase3?.score ?? '—';
  el.innerHTML = `
    <div style="margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span class="grade-badge ${gradeClass(grade)}" style="font-size:13px;padding:3px 10px">${grade}</span>
        <span style="color:var(--muted);font-size:11px">점수: <strong style="color:var(--text)">${score}</strong></span>
        <span style="color:var(--muted);font-size:11px">${lastPacket.elapsed_ms || '—'}ms</span>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:4px">처리 지시</div>
      <div style="font-size:12px;color:var(--text)">${p.phase5?.action || '—'}</div>
      ${p.phase5?.notice ? `<div style="font-size:11px;color:var(--s2);margin-top:4px">${p.phase5.notice}</div>` : ''}
      ${p.phase5?.legal_basis ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">${p.phase5.legal_basis}</div>` : ''}
    </div>
    <hr style="border-color:var(--border);margin:8px 0">
    <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Phase 0 — 소통 객체</div>
    <div style="font-size:12px;margin-bottom:10px">
      유형: ${p.phase0?.sender_type || '—'}<br>
      목적: ${p.phase0?.purpose || '—'}
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Phase 1 — 탐지 패턴</div>
    <div style="font-size:12px;margin-bottom:10px">
      키워드: ${(p.phase1?.keywords || []).join(', ') || '없음'}<br>
      패턴: ${(p.phase1?.patterns || []).join(', ') || '없음'}
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Phase 2 — 법령 분류</div>
    <div style="font-size:12px;margin-bottom:10px">
      유형: ${p.phase2?.law_type || '—'}<br>
      조항: ${(p.phase2?.articles || []).join(', ') || '없음'}
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Phase 3~4 — 점수/등급</div>
    <div style="font-size:12px;margin-bottom:4px">
      점수: <strong>${score}</strong><br>
      이유: ${p.phase3?.reason || '—'}
    </div>
  `;
}

function showPipeline(pipeline) {
  if (!pipeline || !Object.keys(pipeline).length) return;
  lastPacket = { ...(lastPacket || {}), pipeline };
  switchDebug('pipeline');
}

// ── 초기화 ──
if (token && myUser) onLogin();

document.getElementById('new-conv-target').addEventListener('keydown', e => {
  if (e.key === 'Enter') createConv();
});
document.getElementById('auth-username').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('auth-password').focus();
});
document.getElementById('auth-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doAuth();
});
</script>
</body>
</html>
